<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cardápio digital — seleção e carrinho em movimento</title>
  <desc id="desc">Um prato é escolhido no catálogo e levado ao resumo do pedido, mostrando o fluxo de descoberta e compra local.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#103330"/><stop offset="1" stop-color="#192520"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fbbf77"/><stop offset="1" stop-color="#f16d5b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071512" flood-opacity=".4"/></filter>
  </defs>
  <style>
    .focus{transform-box:fill-box;transform-origin:center;animation:focus 5s cubic-bezier(.23,1,.32,1) infinite}.featured{transform-box:fill-box;transform-origin:center;animation:featured 5s cubic-bezier(.23,1,.32,1) infinite}.token{transform-box:fill-box;transform-origin:center;animation:token 5s cubic-bezier(.23,1,.32,1) infinite}.cart{transform-box:fill-box;transform-origin:center;animation:cart 5s cubic-bezier(.23,1,.32,1) infinite}.count{animation:count 5s cubic-bezier(.23,1,.32,1) infinite}.glow{animation:glow 1.8s ease-in-out infinite}@keyframes focus{0%,10%{opacity:0;transform:translateY(14px)}18%,48%{opacity:1;transform:translateY(0)}60%,100%{opacity:.55;transform:translateY(0)}}@keyframes featured{0%,18%{transform:scale(.96);opacity:.65}28%,50%{transform:scale(1);opacity:1}62%,100%{transform:scale(.96);opacity:.7}}@keyframes token{0%,40%{opacity:0;transform:translate(0,0) scale(.75)}52%,66%{opacity:1;transform:translate(316px,110px) scale(1)}72%,100%{opacity:0;transform:translate(316px,110px) scale(.75)}}@keyframes cart{0%,58%{opacity:.55;transform:translateY(0)}70%,88%{opacity:1;transform:translateY(-5px)}100%{opacity:.55;transform:translateY(0)}}@keyframes count{0%,63%{opacity:0;transform:scale(.6)}72%,100%{opacity:1;transform:scale(1)}}@keyframes glow{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="133" cy="96" r="210" fill="#fbbf77" opacity=".08"/><circle cx="1162" cy="612" r="250" fill="#93c5a6" opacity=".09"/>
  <text x="82" y="99" font-family="Arial, sans-serif" font-size="22" fill="#fff9ee" font-weight="700">CARDÁPIO</text><text x="82" y="130" font-family="Arial, sans-serif" font-size="15" fill="#b8d7c8">escolha rápida, pedido claro</text>
  <g class="focus"><rect x="76" y="182" width="706" height="450" rx="28" fill="#fef9ef" filter="url(#shadow)"/><text x="116" y="235" font-family="Arial, sans-serif" font-size="25" fill="#193b36" font-weight="700">Destaques de hoje</text><rect x="116" y="256" width="110" height="31" rx="16" fill="#e8f4e9"/><text x="138" y="277" font-family="Arial, sans-serif" font-size="14" fill="#317051" font-weight="700">Populares</text></g>
  <g class="featured"><rect x="116" y="318" width="282" height="254" rx="20" fill="#fff" stroke="#f1dfc7"/><rect x="136" y="339" width="242" height="102" rx="14" fill="#f6b875"/><circle cx="257" cy="390" r="48" fill="#f6e4ad"/><circle cx="235" cy="374" r="11" fill="#e9765d"/><circle cx="278" cy="403" r="11" fill="#e9765d"/><circle cx="270" cy="365" r="9" fill="#91bb6b"/><text x="136" y="480" font-family="Arial, sans-serif" font-size="19" fill="#17352f" font-weight="700">Prato da casa</text><text x="136" y="506" font-family="Arial, sans-serif" font-size="14" fill="#62827a">feito na hora · porção individual</text><text x="136" y="548" font-family="Arial, sans-serif" font-size="20" fill="#e66f58" font-weight="700">R$ 24,90</text><rect x="277" y="522" width="101" height="34" rx="17" fill="url(#accent)"/><text x="300" y="544" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">Adicionar</text></g>
  <g opacity=".8"><rect x="430" y="318" width="302" height="112" rx="18" fill="#fff" stroke="#f1dfc7"/><circle cx="474" cy="374" r="34" fill="#bed69c"/><text x="528" y="365" font-family="Arial, sans-serif" font-size="17" fill="#17352f" font-weight="700">Opção vegetariana</text><text x="528" y="390" font-family="Arial, sans-serif" font-size="14" fill="#668078">ingredientes frescos</text><rect x="430" y="456" width="302" height="116" rx="18" fill="#fff" stroke="#f1dfc7"/><circle cx="474" cy="514" r="34" fill="#f1c891"/><text x="528" y="505" font-family="Arial, sans-serif" font-size="17" fill="#17352f" font-weight="700">Bebida gelada</text><text x="528" y="530" font-family="Arial, sans-serif" font-size="14" fill="#668078">combina com seu pedido</text></g>
  <g class="token"><circle cx="325" cy="540" r="20" fill="#f16d5b"/><path d="M315 540h20M325 530v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
  <g class="cart"><rect x="842" y="196" width="360" height="385" rx="28" fill="#f9f2e4" filter="url(#shadow)"/><rect x="842" y="196" width="360" height="78" rx="28" fill="#1e5148"/><path d="M888 236h21l10 20h54" fill="none" stroke="#fff7e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="990" y="243" font-family="Arial, sans-serif" font-size="19" fill="#fff7e8" font-weight="700">Seu pedido</text><g class="count"><circle cx="1147" cy="230" r="15" fill="#f6b875"/><text x="1142" y="236" font-family="Arial, sans-serif" font-size="14" fill="#17352f" font-weight="700">1</text></g><rect x="876" y="305" width="292" height="78" rx="16" fill="#fff"/><circle cx="915" cy="344" r="23" fill="#f6b875"/><text x="955" y="337" font-family="Arial, sans-serif" font-size="16" fill="#183b35" font-weight="700">Prato da casa</text><text x="955" y="362" font-family="Arial, sans-serif" font-size="14" fill="#6a887e">1 item · R$ 24,90</text><path d="M878 422h288" stroke="#d6d3c5"/><text x="878" y="462" font-family="Arial, sans-serif" font-size="15" fill="#688379">Total</text><text x="1084" y="462" font-family="Arial, sans-serif" font-size="21" fill="#17352f" font-weight="700">R$ 24,90</text><rect class="glow" x="876" y="492" width="292" height="52" rx="16" fill="url(#accent)"/><text x="951" y="524" font-family="Arial, sans-serif" font-size="16" fill="#fff" font-weight="700">Continuar pedido</text></g>
</svg>

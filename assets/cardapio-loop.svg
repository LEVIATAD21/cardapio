<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cardápio digital em movimento</title><desc id="desc">Cartões de itens e navegação sutilmente animados.</desc>
  <style>@keyframes slide{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(22px);opacity:1}}@keyframes shine{0%{transform:translateX(-160px);opacity:0}30%,70%{opacity:.7}100%{transform:translateX(300px);opacity:0}}.item{animation:slide 3s ease-in-out infinite}.shine{animation:shine 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.item,.shine{animation:none}}</style>
  <image href="cardapio-hero.png" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect class="item" x="760" y="245" width="150" height="70" rx="14" fill="#fff0d4" opacity=".48"/><rect class="item" style="animation-delay:.55s" x="790" y="340" width="150" height="70" rx="14" fill="#f4c48a" opacity=".4"/><rect class="item" style="animation-delay:1.1s" x="820" y="435" width="150" height="70" rx="14" fill="#b8d69b" opacity=".4"/><rect class="shine" x="980" y="215" width="70" height="310" rx="28" fill="#fffdf5" opacity=".3"/>
</svg>
